name: Android Signed Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-signed-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify commit-bound release inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          node scripts/verify-action-pins.mjs
          node scripts/verify-action-pins.mjs --resolve
          npm run terminal:verify
          npm run fixtures:verify
      - name: Validate complete signing identity
        env:
          KEYSTORE_PRESENT: ${{ secrets.PIMOBILE_KEYSTORE_BASE64 != '' }}
          KEYSTORE_PASSWORD_PRESENT: ${{ secrets.PIMOBILE_KEYSTORE_PASSWORD != '' }}
          KEY_PASSWORD_PRESENT: ${{ secrets.PIMOBILE_KEY_PASSWORD != '' }}
        run: |
          [[ "$KEYSTORE_PRESENT" == true && "$KEYSTORE_PASSWORD_PRESENT" == true && "$KEY_PASSWORD_PRESENT" == true ]] || {
            echo "all release signing secrets are required"
            exit 1
          }
      - name: Decode release keystore
        env:
          PIMOBILE_KEYSTORE_BASE64: ${{ secrets.PIMOBILE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$PIMOBILE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.p12"
          chmod 600 "$RUNNER_TEMP/keystore/release.p12"
          echo "PI_MOBILE_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          PI_MOBILE_KEYSTORE_PASSWORD: ${{ secrets.PIMOBILE_KEYSTORE_PASSWORD }}
          PI_MOBILE_KEY_PASSWORD: ${{ secrets.PIMOBILE_KEY_PASSWORD }}
          PI_MOBILE_KEY_ALIAS: ${{ secrets.PIMOBILE_KEY_ALIAS }}
        run: ./gradlew --no-daemon verifyEnvironment testDebugUnitTest lintDebug :android:app:assembleRelease
      - name: Verify package, version, and signer
        run: node scripts/verify-release-identity.mjs android/app/build/outputs/apk/release/app-release.apk >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
