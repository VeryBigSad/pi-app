name: Android Release

# Manual, assisted-release pipeline: build/verify signed APK, mirror it anonymously to
# VeryBigSad/pi-app-releases, generate update-v1.json deterministically, publish the feed.
#
# Secrets:
# - Environment "android-release": PIMOBILE_KEYSTORE_BASE64 + key passwords (local-signing path).
#   When keystore secrets are absent, supply apk_run_id pointing at a workflow run whose
#   app-release-signed artifact was produced by local signing (sign locally, then upload the APK
#   as an artifact via `gh run upload` / actions/upload-artifact in a prior run).
# - secrets.RELEASE_PUBLISH_TOKEN: fine-grained PAT (NOT GITHUB_TOKEN) scoped to repositories
#   VeryBigSad/pi-app-releases and VeryBigSad/verybigsad.github.io with contents:write — required
#   for cross-repo release upload and feed push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z); must equal v{versionName} from gradle/app-version.properties"
        required: true
        type: string
      apk_run_id:
        description: "Optional run id whose app-release-signed artifact is the pre-signed APK (local-signing flow)"
        required: false
        type: string

permissions:
  contents: write

env:
  APK_PATH: android/app/build/outputs/apk/release/app-release.apk

jobs:
  release:
    # Signing and publishing are only ever allowed from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    env:
      KEYSTORE_PRESENT: ${{ secrets.PIMOBILE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Load release identity pin (canonical release/identity.properties)
        run: |
          pin=$(sed -n 's/^certificateSha256=//p' release/identity.properties | tr -d '[:space:]')
          test -n "$pin" || { echo "release/identity.properties missing certificateSha256"; exit 1; }
          echo "PIN=$pin" >> "$GITHUB_ENV"

      - name: Decode release keystore (when Environment secrets exist)
        if: ${{ env.KEYSTORE_PRESENT == 'true' }}
        env:
          PIMOBILE_KEYSTORE_BASE64: ${{ secrets.PIMOBILE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$PIMOBILE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.p12"
          echo "PI_MOBILE_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        if: ${{ env.KEYSTORE_PRESENT == 'true' }}
        env:
          PI_MOBILE_KEYSTORE_PASSWORD: ${{ secrets.PIMOBILE_KEYSTORE_PASSWORD }}
          PI_MOBILE_KEY_PASSWORD: ${{ secrets.PIMOBILE_KEY_PASSWORD }}
          PI_MOBILE_KEY_ALIAS: ${{ secrets.PIMOBILE_KEY_ALIAS }}
        run: ./gradlew --no-daemon :android:app:assembleRelease

      - name: Fetch pre-signed APK artifact (local-signing flow)
        if: ${{ env.KEYSTORE_PRESENT != 'true' }}
        uses: actions/download-artifact@018ccb2cd3f31446a44ef1a714fd76a6b1b5e5e0
        with:
          name: app-release-signed
          run-id: ${{ inputs.apk_run_id }}
          path: ${{ runner.temp }}/presigned

      - name: Stage pre-signed APK
        if: ${{ env.KEYSTORE_PRESENT != 'true' }}
        run: |
          test -n "${{ inputs.apk_run_id }}" || { echo "apk_run_id required when keystore secrets are absent"; exit 1; }
          apk=$(find "$RUNNER_TEMP/presigned" -name '*.apk' | head -n1)
          test -n "$apk" || { echo "no pre-signed apk artifact"; exit 1; }
          mkdir -p "$(dirname "$APK_PATH")"
          cp "$apk" "$APK_PATH"

      - name: Verify APK identity fail-closed (apksigner + fingerprint pin)
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          out=$("$apksigner" verify --print-certs "$APK_PATH")
          echo "$out"
          signers=$(echo "$out" | grep -c 'certificate SHA-256 digest:' || true)
          test "$signers" -eq 1 || { echo "expected exactly one signer, got $signers"; exit 1; }
          digest=$(echo "$out" | grep -m1 'certificate SHA-256 digest:' | sed -E 's/.*: ([0-9a-f]{64}).*/\1/' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          test "$digest" = "$PIN" || { echo "certificate $digest != pin $PIN"; exit 1; }
          echo "$digest" > "$RUNNER_TEMP/cert.sha256"

      - name: Verify release identity (repo DAL cross-check)
        run: node scripts/verify-release-identity.mjs "$APK_PATH"

      - name: Verify tag matches versionName and versionCode is monotonic
        run: |
          props=gradle/app-version.properties
          grep -q '^versionCode=[1-9][0-9]*$' "$props" || { echo "versionCode invalid"; exit 1; }
          versionName=$(sed -n 's/^versionName=//p' "$props" | tr -d '[:space:]')
          test "${{ inputs.tag }}" = "v$versionName" || { echo "tag ${{ inputs.tag }} != v$versionName"; exit 1; }

      - name: Publish mirror release (anonymous APK download)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          GH_REPO: VeryBigSad/pi-app-releases
        run: |
          if gh release view "${{ inputs.tag }}" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" "$APK_PATH#app-release.apk" --repo "$GH_REPO" --clobber
          else
            gh release create "${{ inputs.tag }}" "$APK_PATH#app-release.apk" --repo "$GH_REPO" \
              --title "${{ inputs.tag }}" --notes "Pi Mobile ${{ inputs.tag }} (anonymous APK mirror)"
          fi

      - name: Verify anonymous download
        run: |
          url="https://github.com/VeryBigSad/pi-app-releases/releases/download/${{ inputs.tag }}/app-release.apk"
          code=$(curl -sSL -o "$RUNNER_TEMP/mirror.apk" -w '%{http_code}' "$url")
          test "$code" = "200" || { echo "anonymous download HTTP $code"; exit 1; }
          cmp -s "$RUNNER_TEMP/mirror.apk" "$APK_PATH" || { echo "mirror bytes differ"; exit 1; }

      - name: Generate update-v1.json deterministically
        run: |
          node scripts/generate-update-metadata.mjs "$APK_PATH" "${{ inputs.tag }}" \
            --certificate-sha256 "$(cat "$RUNNER_TEMP/cert.sha256")" --out "$RUNNER_TEMP/update-v1.json"

      - name: Publish feed to VeryBigSad/verybigsad.github.io
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/pages"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/VeryBigSad/verybigsad.github.io.git" "$RUNNER_TEMP/pages"
          mkdir -p "$RUNNER_TEMP/pages/pi-mobile"
          cp "$RUNNER_TEMP/update-v1.json" "$RUNNER_TEMP/pages/pi-mobile/update-v1.json"
          cd "$RUNNER_TEMP/pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pi-mobile/update-v1.json
          if git diff --cached --quiet; then
            echo "feed already up to date"
          else
            git commit -m "pi-mobile: publish update feed for ${{ inputs.tag }}"
            git push
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@330a01c49064d7c7b5cd9b5e3b4bb5a60e0a878a
        with:
          name: app-release-signed
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
