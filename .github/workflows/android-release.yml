name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New immutable release tag (vX.Y.Z); must equal v{versionName}"
        required: true
        type: string
      apk_run_id:
        description: "Source android-release run id for the pre-signed APK path"
        required: false
        type: string
      apk_sha256:
        description: "Required pre-signed APK SHA-256, bound to apk_run_id and this commit"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  APK_PATH: android/app/build/outputs/apk/release/app-release.apk
  GH_REPO: VeryBigSad/pi-app
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_RUN_ID: ${{ inputs.apk_run_id }}
  EXPECTED_APK_SHA256: ${{ inputs.apk_sha256 }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    env:
      KEYSTORE_PRESENT: ${{ secrets.PIMOBILE_KEYSTORE_BASE64 != '' }}
      KEYSTORE_PASSWORD_PRESENT: ${{ secrets.PIMOBILE_KEYSTORE_PASSWORD != '' }}
      KEY_PASSWORD_PRESENT: ${{ secrets.PIMOBILE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate request and signing mode
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z"; exit 1; }
          if [[ "$KEYSTORE_PRESENT" == true || "$KEYSTORE_PASSWORD_PRESENT" == true || "$KEY_PASSWORD_PRESENT" == true ]]; then
            [[ "$KEYSTORE_PRESENT" == true && "$KEYSTORE_PASSWORD_PRESENT" == true && "$KEY_PASSWORD_PRESENT" == true ]] || {
              echo "all keystore, store-password, and key-password secrets must be configured together"
              exit 1
            }
            [[ -z "$SOURCE_RUN_ID" && -z "$EXPECTED_APK_SHA256" ]] || {
              echo "apk_run_id/apk_sha256 are only valid when keystore secrets are absent"
              exit 1
            }
          else
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "apk_run_id required for pre-signed mode"; exit 1; }
            [[ "$EXPECTED_APK_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "apk_sha256 required for pre-signed mode"; exit 1; }
          fi

      - name: Enforce immutable release policy, new tag, and monotonic versionCode
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: node scripts/verify-release-state.mjs "$RELEASE_TAG"

      - name: Validate pre-signed source run
        if: ${{ env.KEYSTORE_PRESENT != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"' \
            <<<"$run_json" >/dev/null || { echo "source run is not a completed run for this main commit"; exit 1; }
          workflow_id=$(jq -r '.workflow_id' <<<"$run_json")
          workflow_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id")
          jq -e '.path == ".github/workflows/android-signed-artifact.yml"' <<<"$workflow_json" >/dev/null || {
            echo "source run was not produced by android-signed-artifact.yml"
            exit 1
          }
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")
          jq -e '[.artifacts[] | select(.name == "app-release-signed" and .expired == false)] | length == 1' \
            <<<"$artifacts" >/dev/null || { echo "source run must have exactly one live app-release-signed artifact"; exit 1; }

      - name: Load release identity pin
        run: |
          pin=$(sed -n 's/^certificateSha256=//p' release/identity.properties | tr -d '[:space:]')
          [[ "$pin" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]] || { echo "canonical certificate pin invalid"; exit 1; }
          echo "PIN=$pin" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_PRESENT == 'true' }}
        env:
          PIMOBILE_KEYSTORE_BASE64: ${{ secrets.PIMOBILE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$PIMOBILE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.p12"
          chmod 600 "$RUNNER_TEMP/keystore/release.p12"
          echo "PI_MOBILE_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        if: ${{ env.KEYSTORE_PRESENT == 'true' }}
        env:
          PI_MOBILE_KEYSTORE_PASSWORD: ${{ secrets.PIMOBILE_KEYSTORE_PASSWORD }}
          PI_MOBILE_KEY_PASSWORD: ${{ secrets.PIMOBILE_KEY_PASSWORD }}
          PI_MOBILE_KEY_ALIAS: ${{ secrets.PIMOBILE_KEY_ALIAS }}
        run: ./gradlew --no-daemon :android:app:assembleRelease

      - name: Fetch commit-bound pre-signed APK artifact
        if: ${{ env.KEYSTORE_PRESENT != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-release-signed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.apk_run_id }}
          path: ${{ runner.temp }}/presigned

      - name: Stage the only pre-signed APK
        if: ${{ env.KEYSTORE_PRESENT != 'true' }}
        run: |
          mapfile -d '' apks < <(find "$RUNNER_TEMP/presigned" -type f -name '*.apk' -print0)
          test "${#apks[@]}" -eq 1 || { echo "pre-signed artifact must contain exactly one APK"; exit 1; }
          mkdir -p "$(dirname "$APK_PATH")"
          cp "${apks[0]}" "$APK_PATH"

      - name: Verify package, version, signer, and APK SHA-256
        run: |
          args=("$APK_PATH" --tag "$RELEASE_TAG" --out "$RUNNER_TEMP/release-verification.json")
          if [[ "$KEYSTORE_PRESENT" != true ]]; then
            args+=(--expected-sha256 "$EXPECTED_APK_SHA256")
          fi
          node scripts/verify-release-identity.mjs "${args[@]}"
          apk_sha256=$(jq -r '.sha256' "$RUNNER_TEMP/release-verification.json")
          test "$apk_sha256" != null || { echo "verified APK SHA-256 missing"; exit 1; }
          echo "APK_SHA256=$apk_sha256" >> "$GITHUB_ENV"

      - name: Preserve verified signed APK as a run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-release-signed
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Generate deterministic release metadata
        run: |
          published_at=$(git show -s --format=%cI "$GITHUB_SHA")
          node scripts/generate-update-metadata.mjs "$APK_PATH" "$RELEASE_TAG" \
            --certificate-sha256 "$PIN" --published-at "$published_at" --out "$RUNNER_TEMP/update-v1.json" >/dev/null
          metadata_sha256=$(sha256sum "$RUNNER_TEMP/update-v1.json" | cut -d' ' -f1)
          echo "METADATA_SHA256=$metadata_sha256" >> "$GITHUB_ENV"

      - name: Create new draft release with complete assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$APK_PATH#app-release.apk" "$RUNNER_TEMP/update-v1.json#update-v1.json" \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --draft \
            --title "$RELEASE_TAG" --notes "Pi Mobile $RELEASE_TAG (anonymous APK mirror)" >/dev/null
          release_json=
          for attempt in {1..12}; do
            release_json=$(gh api --method GET "repos/$GH_REPO/releases?per_page=100" -f type=all)
            if jq -e --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" \
              '[.[] | select(.draft == true and .tag_name == $tag and .target_commitish == $sha)] | length == 1' \
              <<<"$release_json" >/dev/null; then
              break
            fi
            test "$attempt" -lt 12 || { echo "unique draft release missing after retries"; exit 1; }
            sleep 5
          done
          release_id=$(jq -r --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" \
            '[.[] | select(.draft == true and .tag_name == $tag and .target_commitish == $sha)] | if length == 1 then .[0].id else empty end' \
            <<<"$release_json")
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || { echo "unique draft release id missing"; exit 1; }
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Verify draft assets before irreversible publication
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          release_json=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          jq -e --arg sha "$GITHUB_SHA" \
            '.draft == true and .prerelease == false and .immutable == false and .target_commitish == $sha' \
            <<<"$release_json" >/dev/null || { echo "draft release identity differs"; exit 1; }
          jq -e '[.assets[].name] | sort == ["app-release.apk", "update-v1.json"]' \
            <<<"$release_json" >/dev/null || { echo "draft release asset set differs"; exit 1; }
          apk_digest=$(jq -r '.assets[] | select(.name == "app-release.apk") | .digest' <<<"$release_json")
          metadata_digest=$(jq -r '.assets[] | select(.name == "update-v1.json") | .digest' <<<"$release_json")
          test "$apk_digest" = "sha256:$APK_SHA256" || { echo "draft APK digest differs"; exit 1; }
          test "$metadata_digest" = "sha256:$METADATA_SHA256" || { echo "draft metadata digest differs"; exit 1; }
          rm -rf "$RUNNER_TEMP/draft-assets"
          mkdir -p "$RUNNER_TEMP/draft-assets"
          while IFS=$'\t' read -r asset_id asset_name; do
            case "$asset_name" in
              app-release.apk|update-v1.json) ;;
              *) echo "unexpected draft asset $asset_name"; exit 1 ;;
            esac
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$asset_id" \
              > "$RUNNER_TEMP/draft-assets/$asset_name"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"$release_json")
          cmp -s "$RUNNER_TEMP/draft-assets/app-release.apk" "$APK_PATH" || { echo "draft APK bytes differ"; exit 1; }
          cmp -s "$RUNNER_TEMP/draft-assets/update-v1.json" "$RUNNER_TEMP/update-v1.json" || {
            echo "draft metadata bytes differ"
            exit 1
          }

      - name: Publish and lock immutable release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -f draft=false -f make_latest=true >/dev/null

      - name: Verify immutable release attestation, target, assets, and anonymous bytes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          release_json=
          for attempt in {1..12}; do
            release_json=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")
            if jq -e '.draft == false and .prerelease == false and .immutable == true' <<<"$release_json" >/dev/null; then
              break
            fi
            test "$attempt" -lt 12 || { echo "published release is not immutable"; exit 1; }
            sleep 5
          done
          ref_json=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")
          jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' \
            <<<"$ref_json" >/dev/null || { echo "release tag does not point exactly at target commit"; exit 1; }
          for attempt in {1..12}; do
            if gh release verify "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 12 || { echo "immutable release attestation unavailable"; exit 1; }
            sleep 5
          done
          gh release verify-asset "$RELEASE_TAG" "$APK_PATH" --repo "$GH_REPO" >/dev/null
          gh release verify-asset "$RELEASE_TAG" "$RUNNER_TEMP/update-v1.json" --repo "$GH_REPO" >/dev/null
          rm -rf "$RUNNER_TEMP/immutable-assets"
          mkdir -p "$RUNNER_TEMP/immutable-assets"
          apk_url="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/app-release.apk"
          metadata_url="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/update-v1.json"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/immutable-assets/app-release.apk" "$apk_url"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/immutable-assets/update-v1.json" "$metadata_url"
          cmp -s "$RUNNER_TEMP/immutable-assets/app-release.apk" "$APK_PATH" || { echo "immutable APK bytes differ"; exit 1; }
          cmp -s "$RUNNER_TEMP/immutable-assets/update-v1.json" "$RUNNER_TEMP/update-v1.json" || {
            echo "immutable metadata bytes differ"
            exit 1
          }
          node scripts/verify-release-identity.mjs "$RUNNER_TEMP/immutable-assets/app-release.apk" \
            --tag "$RELEASE_TAG" --expected-sha256 "$APK_SHA256" >/dev/null

      - name: Publish verified immutable asset as update feed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/pages"
          auth=$(printf '%s' "x-access-token:$GH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git clone --depth 1 "https://github.com/VeryBigSad/verybigsad.github.io.git" "$RUNNER_TEMP/pages"
          git -C "$RUNNER_TEMP/pages" config --local --unset-all http.https://github.com/.extraheader || true
          git -C "$RUNNER_TEMP/pages" remote set-url origin \
            "https://github.com/VeryBigSad/verybigsad.github.io.git"
          mkdir -p "$RUNNER_TEMP/pages/pi-mobile"
          feed="$RUNNER_TEMP/pages/pi-mobile/update-v1.json"
          if [[ -f "$feed" ]]; then
            node scripts/verify-release-state.mjs --feed-advance \
              "$feed" "$RUNNER_TEMP/immutable-assets/update-v1.json"
          fi
          cp "$RUNNER_TEMP/immutable-assets/update-v1.json" "$feed"
          cd "$RUNNER_TEMP/pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pi-mobile/update-v1.json
          git diff --cached --quiet && { echo "refusing unchanged feed for a new immutable release"; exit 1; }
          git commit -m "pi-mobile: publish update feed for $RELEASE_TAG"
          test "$(git remote get-url origin)" = "https://github.com/VeryBigSad/verybigsad.github.io.git"
          git push origin HEAD:main
          unset auth GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
