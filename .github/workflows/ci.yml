name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Verify immutable action pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-action-pins.mjs
          node scripts/verify-action-pins.mjs --resolve
      - run: npm run build
      - run: npm run check
      - run: npm run terminal:verify
      - run: npm run fixtures:verify
      - run: npm run dal:verify
      - run: npm audit --audit-level=high

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5
          cache-dependency-path: relay/go.sum
      - run: npm ci --ignore-scripts
      - name: Resolve locked Gradle coordinates
        run: ./gradlew --no-daemon --no-configuration-cache -I scripts/supply-chain.gradle.kts supplyChainDependencies -PsupplyChainOutput="$RUNNER_TEMP/gradle-components.json"
      - name: Generate SBOMs and enforce licenses
        run: node scripts/supply-chain.mjs --node-modules node_modules --go-dir relay --gradle-components "$RUNNER_TEMP/gradle-components.json" --policy supply-chain/license-policy.json --out-dir "$RUNNER_TEMP/sbom"
      - name: Scan Node, Go, Gradle SBOMs and pinned relay image
        env:
          GRYPE_IMAGE: anchore/grype@sha256:f08d12771097208b3f1bdb1fe7c9b171b4e60ffe522453f1814fdbf1169fdea9
          RELAY_IMAGE: relay-supply-chain:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$GRYPE_IMAGE"
          for sbom in "$RUNNER_TEMP"/sbom/*.cdx.json; do
            docker run --rm -v "$RUNNER_TEMP/sbom:/sbom:ro" "$GRYPE_IMAGE" "sbom:/sbom/$(basename "$sbom")" --fail-on high
          done
          docker build --pull=false --file relay/Dockerfile --tag "$RELAY_IMAGE" .
          docker save --output "$RUNNER_TEMP/relay-image.tar" "$RELAY_IMAGE"
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$GRYPE_IMAGE" \
            docker-archive:/scan/relay-image.tar --fail-on high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: supply-chain-${{ github.sha }}
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon :android:core:update:testDebugUnitTest :android:core:update:lintDebug
      - run: ./gradlew --no-daemon verifyEnvironment testDebugUnitTest lintDebug assembleDebug assembleRelease

  android-api29:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: ./gradlew --no-daemon --max-workers=2 -Porg.gradle.workers.max=2 connectedDebugAndroidTest

  android-api34-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: ./gradlew --no-daemon --max-workers=2 -Porg.gradle.workers.max=2 :android:app:connectedDebugAndroidTest :android:terminal:connectedDebugAndroidTest

  terraform:
    runs-on: ubuntu-latest
    env:
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/terraform/terraformrc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.8
      - working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - working-directory: infra/terraform
        run: terraform init -backend=false
      - working-directory: infra/terraform
        run: terraform validate

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5
          cache-dependency-path: relay/go.mod
      - working-directory: relay
        run: go test -race ./...
      - working-directory: relay
        run: go vet ./...
      - run: test -z "$(gofmt -l relay)"
