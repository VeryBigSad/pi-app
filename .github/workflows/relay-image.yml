name: relay-image

on:
  pull_request:
    paths:
      - relay/**
      - .dockerignore
      - .github/workflows/relay-image.yml
  push:
    branches: [main]
    paths:
      - relay/**
      - .dockerignore
      - .github/workflows/relay-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/verybigsad/pi-app/relay
  BUILDX_VERSION: v0.36.1

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.2
          cache-dependency-path: relay/go.sum
      - working-directory: relay
        run: go test -race ./...
      - working-directory: relay
        run: go vet ./...
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: ${{ env.BUILDX_VERSION }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64
          load: true
          tags: relay-verify:${{ github.sha }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
      - env:
          VERIFY_IMAGE: relay-verify:${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$VERIFY_IMAGE")" = "65532:65532"
          docker run --rm "$VERIFY_IMAGE" -h
          container=$(docker create "$VERIFY_IMAGE")
          docker cp "$container":/usr/local/bin/wget /tmp/relay-wget
          docker rm "$container" >/dev/null
          test -s /tmp/relay-wget

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CANDIDATE_TAG: unsigned-sha-${{ github.sha }}
      RELEASE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
        with:
          version: ${{ env.BUILDX_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The candidate tag is a staging reference only. The deployable release
      # tag is published solely by the promote step below, after cosign sign
      # and verify succeed. On failure the candidate version is deleted.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ env.CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=relay
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - id: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$DIGEST"
      - id: verify-signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/relay-image.yml@${{ github.ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" >/dev/null
      - id: promote
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG" "$IMAGE@$DIGEST"
      - name: Remove unsigned candidate on failure
        if: ${{ failure() && steps.promote.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package="${GITHUB_REPOSITORY#*/}/relay"
          package="${package//\//%2F}"
          ids=$(gh api --paginate "/user/packages/container/$package/versions?per_page=100" \
            --jq ".[] | select(any(.metadata.container.tags[]?; . == \"$CANDIDATE_TAG\")) | .id")
          if [ -z "$ids" ]; then
            printf '::error::no candidate version carrying %s found; remove it manually in GHCR package settings\n' "$CANDIDATE_TAG"
            exit 1
          fi
          for id in $ids; do
            gh api -X DELETE "/user/packages/container/$package/versions/$id"
          done
      - run: docker logout ghcr.io
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/relay-image.yml@${{ github.ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker image rm "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
          if ! docker pull "$IMAGE:$RELEASE_TAG"; then
            # Runtime pulls use the private YC Container Registry; GHCR is public provenance
            # only. Warn instead of failing while the GHCR package is private.
            printf '::warning::GHCR package is not anonymously pullable; provenance pull unavailable until the package is public.\n'
            docker login ghcr.io -u "$GITHUB_ACTOR" --password "$GHCR_TOKEN" >/dev/null
            docker pull "$IMAGE:$RELEASE_TAG"
            docker logout ghcr.io >/dev/null
          fi
          test "$(docker image inspect --format '{{.RepoDigests}}' "$IMAGE:$RELEASE_TAG")" = "[$IMAGE@$DIGEST]"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" >/dev/null
          printf "Deploy digest: \`%s@%s\`\n" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
